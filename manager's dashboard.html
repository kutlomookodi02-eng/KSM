<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing Store Manager Dashboard</title>
    <style>
        :root {
            --primary: #0984e3;
            --success: #27ae60;
            --background: #f4f7f6;
            --sidebar-bg: #2d3436;
            --text-dark: #333333;
            --white: #ffffff;
        }
        
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            display: flex;
            height: 100vh;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 250px;
            background-color: var(--sidebar-bg);
            color: var(--white);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .sidebar h2 {
            font-size: 20px;
            text-align: center;
            margin-bottom: 30px;
            color: #dfe6e9;
        }

        .sidebar a {
            color: #b2bec3;
            text-decoration: none;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 15px;
            transition: 0.2s;
        }

        .sidebar a:hover, .sidebar a.active {
            background-color: var(--primary);
            color: var(--white);
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        header h1 {
            color: var(--text-dark);
            margin-top: 0;
        }

        /* Metric Cards Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--white);
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .card h3 {
            margin: 0;
            font-size: 14px;
            color: #666;
        }

        .card p {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-dark);
            margin: 10px 0 0 0;
        }

        /* Action Panel */
        .action-panel {
            background: var(--white);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .action-panel p {
            margin: 0;
            color: #666;
        }

        .btn {
            background-color: var(--primary);
            color: var(--white);
            padding: 12px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn:hover {
            background-color: #006bbf;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>KSM Store</h2>
        <a href="dashboard.html" class="active">Dashboard</a>
        <a href="management.html">Add New Product</a>
        <a href="export.php">Export Inventory</a>
    </div>

    <div class="main-content">
        <header>
            <h1>Manager Overview</h1>
        </header>

        <div class="metrics-grid">
            <div class="card">
                <h3>Total Products Tracked</h3>
                <p>0</p>
            </div>
            <div class="card">
                <h3>Total Units in Stock</h3>
                <p>0</p>
            </div>
            <div class="card">
                <h3>Total Units Sold</h3>
                <p>0</p>
            </div>
        </div>

        <div class="action-panel">
            <div>
                <h3>Inventory Management</h3>
                <p>Log incoming retail stock or pull real-time datasets for spreadsheet analytics.</p>
            </div>
            <a href="management.html" class="btn">Go to Data Entry Form</a>
        </div>
    </div>

</body>
</html>
