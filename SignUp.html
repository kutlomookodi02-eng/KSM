<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .signup-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            z-index: 10;
        }

        .signup-container h2 {
            margin-bottom: 24px;
            color: #333;
            text-align: center;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #0984e3;
        }

        .button-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            text-decoration: none;
            text-align: center;
            display: inline-block;
        }

        .signup-btn {
            background: #0984e3;
            color: white;
        }

        .signup-btn:hover {
            background: #006bbf;
        }

        .back-btn {
            background: #dfe4ea;
            color: #2f3542;
        }

        .back-btn:hover {
            background: #ced6e0;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Truck Animation Styles */
        .truck-wrapper {
            position: absolute;
            bottom: 30px;
            left: -150px;
            animation: driveTruck 6s linear infinite;
        }

        .truck {
            position: relative;
            width: 120px;
            height: 60px;
        }

        .truck-body {
            position: absolute;
            width: 80px;
            height: 50px;
            background: #ff4757;
            border-radius: 4px 10px 4px 4px;
            top: 5px;
        }

        .truck-cabin {
            position: absolute;
            width: 40px;
            height: 35px;
            background: #ff6b81;
            right: -35px;
            top: 20px;
            border-radius: 0 10px 4px 0;
        }

        .truck-window {
            position: absolute;
            width: 15px;
            height: 15px;
            background: #dfe4ea;
            right: -25px;
            top: 25px;
            border-radius: 0 6px 0 0;
        }

        .wheel {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #2f3542;
            border-radius: 50%;
            bottom: -5px;
            border: 3px dashed #dfe4ea;
            animation: spinWheel 0.5s linear infinite;
        }

        .wheel-front {
            right: -25px;
        }

        .wheel-back {
            left: 15px;
        }

        .road {
            position: absolute;
            bottom: 25px;
            width: 100%;
            height: 4px;
            background: #dfe4ea;
        }

        @keyframes driveTruck {
            0% {
                left: -150px;
            }
            100% {
                left: 105%;
            }
        }

        @keyframes spinWheel {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <h2>Create Account</h2>
        <!-- Wrapped inputs inside a form pointing to register.php -->
        <form action="register.php" method="POST" class="form-wrapper">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Choose a password" required>
            </div>
            <div class="button-group">
    <a href="login.html" class="btn submit-btn">Sign up</a>
</div>
        </form>
    </div>

</body>
</html>
