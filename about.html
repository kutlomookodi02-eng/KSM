    body {
        margin: 0;
        padding: 0;
        background-color: lightsalmon; /* Fallback color */
    }

    .background-slideshow {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1; /* Keeps the images behind your text */
    }

    .slide {
        position: absolute;
        width: 100%;
        height: 100%;
        background-size: cover;
        background-position: center;
        opacity: 0;
        animation: slideAnimation 15s infinite; /* 15 seconds total loop */
    }

    /* Add your image URLs here */
    .slide:nth-child(1) { 
        background-image: url('Screenshot 2026-02-28 220915.png'); 
        animation-delay: 0s; 
    }
    .slide:nth-child(2) { 
        background-image: url('Screenshot 2026-03-07 092923.png'); 
        animation-delay: 5s; 
    }
    .slide:nth-child(3) { 
        background-image: url('Gemini_Generated_Image_6ai8lu6ai8lu6ai8.png'); 
        animation-delay: 10s; 
    }

    @keyframes slideAnimation {
        0% { opacity: 0; }
        10% { opacity: 1; }  /* Fade in */
        33% { opacity: 1; }  /* Stay visible */
        43% { opacity: 0; }  /* Fade out */
        100% { opacity: 0; }
    }

    /* Ensuring text is readable over images */
    header {
        position: relative;
        color: white;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        padding: 20px;
    }
</style>
